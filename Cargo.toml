[package]
name    = "gamescope-led-sync"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
ab_glyph           = "0.2"
clap               = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
dejavu             = "2.37"
libc               = "0.2"
pipewire           = "0.10"
serde              = { version = "1", features = ["derive"] }
softbuffer         = "0.4"
thiserror          = "2"
toml               = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt"] }
winit              = "0.30"

[profile.release]
opt-level        = 3
debug            = false
debug-assertions = false
overflow-checks  = true
lto              = true
panic            = "abort"
incremental      = false
codegen-units    = 1
rpath            = false
